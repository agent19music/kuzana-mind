# Target is a repo Actions variable, not a secret:
#   gh variable set DEPLOY_TARGET --body render
#   gh variable set DEPLOY_TARGET --body gcloud
#
# Render job needs secrets RENDER_API_KEY + RENDER_SERVICE_ID.
# Migration job requires the alembic_version table to be stamped (done 2026-07-10)
name: Deploy Backend

on:
  push:
    branches: [main]
    paths:
      - "backend/**"
      - ".github/workflows/deploy-backend.yml"
  workflow_dispatch:

env:
  PROJECT_ID: mavuno-493709
  REGION: europe-west1
  SERVICE: kuzana-brain-backend
  IMAGE: europe-west1-docker.pkg.dev/mavuno-493709/kuzana-brain/backend

jobs:
  deploy-gcloud:
    name: Deploy to Cloud Run
    if: ${{ vars.DEPLOY_TARGET != 'render' }}
    runs-on: ubuntu-latest
    permissions:
      contents: read
      issues: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Authenticate to GCP
        uses: google-github-actions/auth@v2
        with:
          credentials_json: ${{ secrets.GCP_SA_KEY }}

      - name: Set up gcloud
        uses: google-github-actions/setup-gcloud@v2
        with:
          project_id: ${{ env.PROJECT_ID }}

      - name: Configure Docker for Artifact Registry
        run: gcloud auth configure-docker europe-west1-docker.pkg.dev --quiet

      - name: Build & push image
        run: |
          docker build \
            -t ${{ env.IMAGE }}:${{ github.sha }} \
            -t ${{ env.IMAGE }}:latest \
            backend/
          docker push ${{ env.IMAGE }}:${{ github.sha }}
          docker push ${{ env.IMAGE }}:latest

      - name: Run database migrations
        id: migrate
        run: |
          gcloud run jobs describe migration \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} >/dev/null 2>&1 || \
          gcloud run jobs create migration \
            --image=${{ env.IMAGE }}:${{ github.sha }} \
            --command=alembic \
            --args=upgrade,head \
            --set-secrets=DATABASE_URL=DATABASE_URL:latest \
            --set-cloudsql-instances=${{ env.PROJECT_ID }}:${{ env.REGION }}:kuzana-brain-db \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --max-retries=0
          gcloud run jobs update migration \
            --image=${{ env.IMAGE }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }}

          if gcloud run jobs execute migration \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --wait; then
            exit 0
          fi

          echo "::group::Migration execution failed — fetching execution details and logs"
          EXECUTION=$(gcloud run jobs executions list \
            --job=migration \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --sort-by='~createTime' \
            --format='value(name.basename())' \
            --limit=1)
          echo "Execution: $EXECUTION"

          gcloud run jobs executions describe "$EXECUTION" \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} || true

          gcloud logging read \
            "resource.type=cloud_run_job AND resource.labels.job_name=migration AND resource.labels.location=${{ env.REGION }} AND labels.\"run.googleapis.com/execution_name\"=\"$EXECUTION\"" \
            --project=${{ env.PROJECT_ID }} \
            --order=asc \
            --limit=200 \
            --format='value(textPayload)' || true
          echo "::endgroup::"

          exit 1

      # A failed migration silently blocked every deploy for a month before
      # anyone noticed. This makes that failure loud: it files (or
      # re-comments on) a GitHub issue instead of only showing up as a red X
      # on a run nobody was watching. The service is NOT updated when this
      # fires — it's still on whatever revision last deployed successfully.
      - name: Alert on migration failure
        if: failure() && steps.migrate.outcome == 'failure'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          TITLE="Backend deploy failed at the migration step"
          RUN_URL="${{ github.server_url }}/${{ github.repository }}/actions/runs/${{ github.run_id }}"
          BODY="Commit \`${{ github.sha }}\` failed \`alembic upgrade head\` during deploy — the live Cloud Run service was **not** updated and is still running the last successfully deployed revision.

          Run: $RUN_URL"

          EXISTING=$(gh issue list --repo "${{ github.repository }}" --search "$TITLE in:title" --state open --json number --jq '.[0].number // empty')
          if [ -n "$EXISTING" ]; then
            gh issue comment "$EXISTING" --repo "${{ github.repository }}" --body "$BODY"
          else
            gh issue create --repo "${{ github.repository }}" --title "$TITLE" --body "$BODY"
          fi

      - name: Deploy to Cloud Run
        run: |
          gcloud run deploy ${{ env.SERVICE }} \
            --image=${{ env.IMAGE }}:${{ github.sha }} \
            --region=${{ env.REGION }} \
            --platform=managed \
            --allow-unauthenticated \
            --add-cloudsql-instances=${{ env.PROJECT_ID }}:${{ env.REGION }}:kuzana-brain-db \
            --set-secrets=GEMINI_API_KEY=GEMINI_API_KEY:latest,DATABASE_URL=DATABASE_URL:latest,AUTOSEND_API_KEY=AUTOSEND_API_KEY:latest,AUTOSEND_TEMPLATE_ID=AUTOSEND_TEMPLATE_ID:latest,AUTOSEND_FROM_EMAIL=AUTOSEND_FROM_EMAIL:latest,CLERK_PUBLISHABLE_KEY=CLERK_PUBLISHABLE_KEY:latest,BACKEND_API_SECRET=BACKEND_API_SECRET:latest \
            --set-env-vars=USE_MOCK=false,SIMILARITY_THRESHOLD=0.65,GCS_BUCKET=kuzana-brain-uploads,SENTRY_DSN=https://6082c942618b71933a1649edaee44a36@o4508969536454656.ingest.de.sentry.io/4512021384921168,SENTRY_ENVIRONMENT=production \
            --port=8000 \
            --memory=512Mi \
            --project=${{ env.PROJECT_ID }}

      - name: Show service URL
        run: |
          gcloud run services describe ${{ env.SERVICE }} \
            --region=${{ env.REGION }} \
            --project=${{ env.PROJECT_ID }} \
            --format="value(status.url)"

  deploy-render:
    name: Deploy to Render
    if: ${{ vars.DEPLOY_TARGET == 'render' }}
    runs-on: ubuntu-latest
    steps:
      - name: Trigger Render deploy
        env:
          RENDER_API_KEY: ${{ secrets.RENDER_API_KEY }}
          RENDER_SERVICE_ID: ${{ secrets.RENDER_SERVICE_ID }}
        run: |
          set -euo pipefail
          if [ -z "${RENDER_API_KEY}" ] || [ -z "${RENDER_SERVICE_ID}" ]; then
            echo "::error::DEPLOY_TARGET=render but RENDER_API_KEY or RENDER_SERVICE_ID is unset. Add both as GitHub Actions secrets. Cloud Run was skipped."
            exit 1
          fi

          CREATE=$(curl -sS -X POST \
            -H "Authorization: Bearer ${RENDER_API_KEY}" \
            -H "Accept: application/json" \
            -H "Content-Type: application/json" \
            "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys" \
            -d '{"clearCache":"do_not_clear"}')

          DEPLOY_ID=$(echo "$CREATE" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('id') or d.get('deploy',{}).get('id') or '')")
          if [ -z "$DEPLOY_ID" ]; then
            echo "::error::Render did not return a deploy id"
            echo "$CREATE"
            exit 1
          fi
          echo "Deploy id: $DEPLOY_ID"

          for i in $(seq 1 60); do
            STATUS_JSON=$(curl -sS \
              -H "Authorization: Bearer ${RENDER_API_KEY}" \
              -H "Accept: application/json" \
              "https://api.render.com/v1/services/${RENDER_SERVICE_ID}/deploys/${DEPLOY_ID}")
            STATUS=$(echo "$STATUS_JSON" | python3 -c "import json,sys; d=json.load(sys.stdin); print(d.get('status') or d.get('deploy',{}).get('status') or '')")
            echo "status=$STATUS"
            case "$STATUS" in
              live|succeeded) exit 0 ;;
              failed|canceled|cancelled|deactivated|build_failed|update_failed|pre_deploy_failed) echo "$STATUS_JSON"; exit 1 ;;
            esac
            sleep 10
          done
          echo "::error::Timed out waiting for Render deploy $DEPLOY_ID"
          exit 1
